<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estudiantes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <nav class="navbar">
        <h2>SpringEduManager</h2>
        <ul class="nav-links">
            <li><a href="/estudiantes">Estudiantes</a></li>
            <li><a href="/cursos">Cursos</a></li>
            <li><a href="/logout">Salir</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Directorio de Estudiantes</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="estudiante : ${estudiantes}">
                    <td th:text="${estudiante.id}"></td>
                    <td th:text="${estudiante.nombre}"></td>
                    <td th:text="${estudiante.apellido}"></td>
                    <td th:text="${estudiante.email}"></td>
                </tr>
            </tbody>
        </table>

        <h2>Registrar Nuevo Estudiante</h2>
        <form th:action="@{/estudiantes/guardar}" th:object="${nuevoEstudiante}" method="post">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required />
            <label>Apellido:</label>
            <input type="text" th:field="*{apellido}" required />
            <label>Email:</label>
            <input type="email" th:field="*{email}" required />
            <button type="submit">Guardar Estudiante</button>
        </form>
    </div>
</body>
</html>
