<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estudiantes</title>
</head>
<body>
    <h1>Lista de Estudiantes</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí Thymeleaf repite esta fila por cada estudiante en la base de datos -->
            <tr th:each="estudiante : ${estudiantes}">
                <td th:text="${estudiante.id}"></td>
                <td th:text="${estudiante.nombre}"></td>
                <td th:text="${estudiante.apellido}"></td>
                <td th:text="${estudiante.email}"></td>
            </tr>
        </tbody>
    </table>

    <h2>Registrar Nuevo Estudiante</h2>
    <!-- Formulario vinculado al objeto de Java -->
    <form th:action="@{/estudiantes/guardar}" th:object="${nuevoEstudiante}" method="post">
        Nombre: <input type="text" th:field="*{nombre}" required /><br><br>
        Apellido: <input type="text" th:field="*{apellido}" required /><br><br>
        Email: <input type="email" th:field="*{email}" required /><br><br>
        <button type="submit">Guardar Estudiante</button>
    </form>
    
    <br>
    <a href="/cursos">Ir a la gestión de Cursos</a>
</body>
</html>
