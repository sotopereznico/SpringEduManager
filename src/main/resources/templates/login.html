<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SpringEduManager</title>
    <!-- Vinculamos nuestro CSS centralizado -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <!-- Usamos el contenedor wrapper para centrar -->
    <div class="login-wrapper">
        <div class="login-box">
            <h1 class="login-title">SpringEduManager</h1>
            <p class="login-subtitle">Ingreso con Spring Security.</p>
            
            <!-- Mensajes de alerta usando clases limpias -->
            <div th:if="${param.error}" class="alert-error">Credenciales inválidas.</div>
            <div th:if="${param.logout}" class="alert-success">Sesión cerrada exitosamente.</div>

            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Correo (Ej: admin@clase.cl)" required />
                <input type="password" name="password" placeholder="Contraseña" required />
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
